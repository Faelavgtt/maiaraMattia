name = "maiaramattia"
main = "worker/src/index.ts"
compatibility_date = "2026-07-16"

[vars]
APP_ORIGIN = "https://maiaramattia.rafavergottii.workers.dev"
ADMIN_OWNER_USERNAME = "admin"
ADMIN_OWNER_EMAIL = ""
ADMIN_OWNER_PASSWORD = ""
WHATSAPP_NUMBER = "556784031367"

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./dist/"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "maiara-files"

[[d1_databases]]
binding = "DB"
database_name = "maiara-db"
database_id = "2fb8cc9a-e1d3-4408-9147-e7c0e41ba00d"
migrations_dir = "worker/migrations"
